# Qualcomm QCS6490 (Rubik Pi 3) Hardware Device Plugin
#
# Uses squat/generic-device-plugin to expose hardware interfaces
# as Kubernetes schedulable resources under the rubikpi.ai domain.
#
# Resources exposed per node:
#   rubikpi.ai/gpu   — Adreno 643L (/dev/dri/renderD128, /dev/dri/card0)
#   rubikpi.ai/npu   — Hexagon CDSP AI engine (/dev/fastrpc-cdsp)
#   rubikpi.ai/isp   — Spectra 570L ISP/camera (/dev/video0)
#   rubikpi.ai/vpu   — Adreno VPU633 video codec (/dev/video10)
#
# The DaemonSet runs on every node (tolerates all taints), so newly
# joined nodes get hardware resources advertised automatically.
#
# Pods requesting hardware:
#   resources:
#     limits:
#       rubikpi.ai/gpu: "1"
#       rubikpi.ai/npu: "1"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: qualcomm-device-plugin
  namespace: kube-system

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: qualcomm-device-plugin
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: qualcomm-device-plugin
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: qualcomm-device-plugin
subjects:
  - kind: ServiceAccount
    name: qualcomm-device-plugin
    namespace: kube-system

---
# Device configuration for all four hardware subsystems.
# The plugin reads this at startup. Paths that do not exist on the host
# are silently skipped — the device is simply not advertised on that node.
apiVersion: v1
kind: ConfigMap
metadata:
  name: qualcomm-device-config
  namespace: kube-system
data:
  config.yaml: |
    resources:
    - name: gpu
      groups:
      - paths:
          - path: /dev/dri/renderD128
          - path: /dev/dri/card0
          - path: /dev/kgsl-3d0
    - name: npu
      groups:
      - paths:
          - path: /dev/fastrpc-cdsp
    - name: video
      groups:
      - paths:
          - path: /dev/video32
          - path: /dev/video33

---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: qualcomm-device-plugin
  namespace: kube-system
  labels:
    app: qualcomm-device-plugin
spec:
  selector:
    matchLabels:
      app: qualcomm-device-plugin
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: qualcomm-device-plugin
    spec:
      serviceAccountName: qualcomm-device-plugin
      priorityClassName: system-node-critical

      # Run on every node — including control plane and tainted nodes
      tolerations:
        - operator: "Exists"

      hostNetwork: false
      hostPID: false

      containers:
        - name: device-plugin
          image: squat/generic-device-plugin:latest
          imagePullPolicy: Always
          args:
            - --domain=rubikpi.ai
            - --plugin-directory=/var/lib/kubelet/device-plugins
            - --device={"name":"gpu","groups":[{"paths":[{"path":"/dev/dri/renderD128"},{"path":"/dev/dri/card0"},{"path":"/dev/kgsl-3d0"}]}]}
            - --device={"name":"npu","groups":[{"paths":[{"path":"/dev/fastrpc-cdsp"}]}]}
            - --device={"name":"video","groups":[{"paths":[{"path":"/dev/video32"},{"path":"/dev/video33"}]}]}
          securityContext:
            privileged: true
            readOnlyRootFilesystem: false
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          volumeMounts:
            # RKE2 uses /var/lib/rancher/rke2/agent/kubelet instead of /var/lib/kubelet
            - name: device-plugin-dir
              mountPath: /var/lib/kubelet/device-plugins
            - name: dev
              mountPath: /dev

      volumes:
        - name: device-plugin-dir
          hostPath:
            path: /var/lib/kubelet/device-plugins
            type: DirectoryOrCreate
        - name: dev
          hostPath:
            path: /dev
