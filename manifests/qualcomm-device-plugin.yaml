# Qualcomm QCS6490 (Rubik Pi 3) Hardware Device Plugin
#
# Uses squat/generic-device-plugin to expose hardware interfaces
# as Kubernetes schedulable resources under the rubikpi.ai domain.
#
# Resources exposed per node:
#   rubikpi.ai/gpu   — Adreno 643L (/dev/dri/renderD128, /dev/dri/card0)
#   rubikpi.ai/npu   — Hexagon CDSP AI engine (/dev/fastrpc-cdsp)
#   rubikpi.ai/isp   — Spectra 570L ISP/camera (/dev/video0)
#   rubikpi.ai/vpu   — Adreno VPU633 video codec (/dev/video10)
#
# The DaemonSet runs on every node (tolerates all taints), so newly
# joined nodes get hardware resources advertised automatically.
#
# Pods requesting hardware:
#   resources:
#     limits:
#       rubikpi.ai/gpu: "1"
#       rubikpi.ai/npu: "1"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: qualcomm-device-plugin
  namespace: kube-system

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: qualcomm-device-plugin
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: qualcomm-device-plugin
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: qualcomm-device-plugin
subjects:
  - kind: ServiceAccount
    name: qualcomm-device-plugin
    namespace: kube-system

---
# Device configuration for all four hardware subsystems.
# The plugin reads this at startup. Paths that do not exist on the host
# are silently skipped — the device is simply not advertised on that node.
apiVersion: v1
kind: ConfigMap
metadata:
  name: qualcomm-device-config
  namespace: kube-system
data:
  config.yaml: |
    # Adreno 643L GPU (MSM DRM driver — mainline Linux)
    # renderD128 is the render node (no display auth required)
    - name: gpu
      groups:
        - count: 1
          paths:
            - path: /dev/dri/renderD128
            - path: /dev/dri/card0

    # Hexagon CDSP — AI Engine / NPU (fastrpc driver)
    - name: npu
      groups:
        - count: 1
          paths:
            - path: /dev/fastrpc-cdsp

    # Qualcomm CAMSS ISP — first camera capture node (V4L2)
    # Additional cameras (/dev/video1, /dev/video2 ...) share the same ISP
    - name: isp
      groups:
        - count: 1
          paths:
            - path: /dev/video0

    # Adreno VPU633 video codec — H.264/H.265/VP9/AV1 decode+encode (Venus driver)
    - name: vpu
      groups:
        - count: 1
          paths:
            - path: /dev/video10

---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: qualcomm-device-plugin
  namespace: kube-system
  labels:
    app: qualcomm-device-plugin
spec:
  selector:
    matchLabels:
      app: qualcomm-device-plugin
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: qualcomm-device-plugin
    spec:
      serviceAccountName: qualcomm-device-plugin
      priorityClassName: system-node-critical

      # Run on every node — including control plane and tainted nodes
      tolerations:
        - operator: "Exists"

      hostNetwork: false
      hostPID: false

      containers:
        - name: device-plugin
          image: squat/generic-device-plugin:latest
          imagePullPolicy: Always
          args:
            - --domain=rubikpi.ai
            - --config=/config/config.yaml
            - --listen=/var/lib/kubelet/device-plugins/rubikpi.sock
          securityContext:
            privileged: true
            readOnlyRootFilesystem: false
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          volumeMounts:
            # Mount RKE2's kubelet device-plugin dir at the plugin's expected path.
            # RKE2 uses /var/lib/rancher/rke2/agent/kubelet instead of /var/lib/kubelet.
            - name: device-plugin-dir
              mountPath: /var/lib/kubelet/device-plugins
            # Full /dev access so the plugin can detect and pass devices to containers
            - name: dev
              mountPath: /dev
            - name: config
              mountPath: /config
              readOnly: true

      volumes:
        - name: device-plugin-dir
          hostPath:
            # RKE2-specific kubelet device-plugin socket directory
            path: /var/lib/rancher/rke2/agent/kubelet/device-plugins
            type: DirectoryOrCreate
        - name: dev
          hostPath:
            path: /dev
        - name: config
          configMap:
            name: qualcomm-device-config
